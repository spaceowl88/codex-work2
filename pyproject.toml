[tool.poetry]
name = "meme-spike-hunter"
version = "0.1.0"
description = "Meme-Coin Spike Hunter"
authors = ["Your Name <you@example.com>"]
license = "MIT"
packages = [{include = "meme_spike_hunter", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "*"
black = "*"
pre-commit = "*"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
